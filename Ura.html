<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吳沅冠雕塑生成系統 | 終極反差版</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden; /* 隱藏滾動條 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script>
/**
 * 吳沅冠雕塑生成系統 - 互動演化 ＆ 第 5 次極限反差版
 */

let myShader;
let time = 0, colorTime = 0, forcePoints = [];
let clickCount = 0; // 點擊計數器

let params = {
  ringCount: 6,
  cameraZ: 8.5,
  speed: 0.04,
  baseBright: 0.35,
  glowBoost: 40,
  sat: 1.2,
  distort: 0.5
};

const vert = `#version 300 es
precision highp float;
in vec3 aPosition;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;
void main() { 
    // 標準投影轉換，確保置中
    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0); 
}`;

const frag = `#version 300 es
precision highp float;
uniform vec2 r;
uniform float t, ct;
uniform vec3 uRot;
uniform float uBaseBright, uGlowBoost, uCameraZ, uSat, uDistort, uRingCount;
uniform vec3 uForcePos[7];
uniform float uForceStrength[7];
uniform float uForceRadius[7];
out vec4 o;

float hash(vec3 p) {
    p = fract(p * vec3(123.34, 456.21, 789.13));
    p += dot(p, p.yzx + 19.19);
    return fract((p.x + p.y) * p.z);
}
float noise(vec3 p) {
    vec3 i = floor(p); vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i + vec3(0, 0, 0)), hash(i + vec3(1, 0, 0)), f.x),
               mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
               mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
               mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}
mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
vec3 rotate3D(vec3 p, vec3 r_ang) {
    p.yz *= rot(r_ang.x); p.xz *= rot(r_ang.y); p.xy *= rot(r_ang.z);
    return p;
}
vec3 ACESFilm(vec3 x) {
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - r.xy) / min(r.x, r.y);
    o = vec4(0.0);
    float z = 0.0;
    
    // 50 次步進，平衡畫質與效能
    for(int i = 0; i < 50; i++) {
        vec3 p_orig = z * normalize(vec3(uv, 1.8));
        p_orig.z -= uCameraZ; 
        p_orig = rotate3D(p_orig, uRot);
        
        float mD = 1e5;
        // 環數上限提升至 12
        for(float j = 1.0; j <= 12.0; j++) {
            if(j > uRingCount) break;
            vec3 p = p_orig;
            p = rotate3D(p, uRot * (0.3 + j * 0.1) + j * 2.5);
            float theta = atan(p.y, p.x);
            
            float disto = noise(vec3(p.x * 0.4, p.y * 0.4, t * 0.3 + j)) * uDistort;
            float dynamicR = (2.2 + j * 0.6) + disto + sin(theta * (2.0 + j * 0.2) + t) * 0.2;
            
            vec2 crossSection = vec2(length(p.xy) - dynamicR, p.z);
            float d_ring = length(crossSection - vec2(sin(theta*2.0 + t), cos(theta*1.6 - t))*2.5) - 0.12;
            mD = smin(mD, d_ring, 0.85);
        }

        // 物理力場發光
        float rOffset = 0.0;
        for(int k = 0; k < 7; k++) {
            float dF = length(p_orig - uForcePos[k] * 1.8);
            if(dF < uForceRadius[k] * 1.5) {
                float pct = 1.0 - (dF / (uForceRadius[k] * 1.5));
                rOffset += uForceStrength[k] * 4.0 * pct * pct;
            }
        }

        float d = 0.2 * abs(mD) + 0.02;
        z += d * 0.3; 
        
        float theta_main = atan(p_orig.y, p_orig.x);
        vec3 proceduralCol = cos(theta_main * 1.2 + ct + p_orig.y * 0.3 + vec3(0.0, 1.2, 2.5)) + uSat; 
        
        float plasmaAccum = (z * 0.12 / (d + 0.005)) + uBaseBright; 
        vec3 AccColor = (proceduralCol * plasmaAccum * 12.0) + (proceduralCol * rOffset * 0.15 * uGlowBoost);
        o += vec4(AccColor, 1.0); 
    }

    // 映射確保不過曝
    o.rgb = ACESFilm(o.rgb / 2.8e4);
}`;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  
  // 徹底解決 Retina 螢幕偏左下的問題
  pixelDensity(1); 
  
  myShader = createShader(vert, frag);
  
  // 初始化 7 個浮動能量核心
  for (let i = 0; i < 7; i++) {
    forcePoints.push({
      pos: createVector(0,0,0),
      angle: random(TAU),
      isPermanent: i < 3,
      strength: 0,
      radius: random(200, 350),
      angleVel: random(0.01, 0.04)
    });
  }
}

// 🌟 核心互動：點擊觸發隨機演化與第五次反轉
function mousePressed() {
  clickCount++;
  
  if (clickCount % 5 === 0) {
    // 🔥 第 5 次：極限反差觸發！
    params.ringCount = params.ringCount < 6 ? floor(random(10, 13)) : floor(random(1, 3)); 
    params.cameraZ = params.cameraZ < 12.0 ? random(25.0, 35.0) : random(2.5, 4.5); 
    params.speed = params.speed < 0.05 ? random(0.15, 0.25) : random(0.001, 0.005); 
    params.baseBright = params.baseBright > 0.4 ? random(0.0, 0.05) : random(0.8, 1.5); 
    params.glowBoost = params.glowBoost < 50 ? random(120, 200) : random(0, 10); 
    params.sat = params.sat > 1.5 ? random(0.0, 0.5) : random(2.5, 4.0); 
    params.distort = params.distort > 1.0 ? 0.0 : random(2.0, 3.5); 
    
    console.log("🔥 第 " + clickCount + " 次：極限反差！", params);
  } else {
    // 🌪️ 前 4 次：常態大隨機演化
    params.ringCount = floor(random(1, 10)); 
    params.cameraZ = random(4.0, 22.0);      
    params.speed = random(0.005, 0.12);      
    params.baseBright = random(0.05, 0.9);   
    params.glowBoost = random(10, 100);      
    params.sat = random(0.5, 2.5);           
    params.distort = random(0.1, 2.0);       
    
    console.log("🌪️ 第 " + clickCount + " 次演化：", params);
  }
}

function draw() {
  background(0);
  
  let dt = params.speed;
  time += dt; 
  colorTime += dt * 1.5;

  forcePoints.forEach(fp => {
    fp.angle += fp.angleVel;
    fp.pos.x = 220 * cos(fp.angle); 
    fp.pos.y = 220 * sin(fp.angle);
    fp.strength = fp.isPermanent ? 140 : 80;
  });

  shader(myShader);
  myShader.setUniform('r', [width, height]);
  myShader.setUniform('t', time);
  myShader.setUniform('ct', colorTime);
  myShader.setUniform('uRot', [frameCount * 0.005, frameCount * 0.003, frameCount * 0.002]);
  
  myShader.setUniform('uBaseBright', params.baseBright);
  myShader.setUniform('uGlowBoost', params.glowBoost);
  myShader.setUniform('uCameraZ', params.cameraZ);
  myShader.setUniform('uSat', params.sat);
  myShader.setUniform('uDistort', params.distort);
  myShader.setUniform('uRingCount', params.ringCount);

  let fPos = [], fStr = [], fRad = [];
  forcePoints.forEach(fp => {
    fPos.push(fp.pos.x * 0.02, fp.pos.y * 0.02, fp.pos.z * 0.02);
    fStr.push(fp.strength * 0.0016); 
    fRad.push(fp.radius * 0.012);
  });
  myShader.setUniform('uForcePos', fPos);
  myShader.setUniform('uForceStrength', fStr);
  myShader.setUniform('uForceRadius', fRad);

  rect(-width / 2, -height / 2, width, height);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
