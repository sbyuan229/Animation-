<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吳沅冠雕塑生成系統 | 終極修復版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #000; color: #000; font-family: "Noto Serif TC", serif; overflow: hidden; display: flex; }
    #ui-panel { position: fixed; left: 0; top: 0; width: 320px; height: 100%; background: #fff; padding: 25px; box-sizing: border-box; z-index: 1000; border-right: 1px solid #000; overflow-y: auto; }
    h2 { font-size: 18px; font-weight: bold; margin-bottom: 25px; margin-top: 0; }
    .section-title { font-size: 11px; color: #999; margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .slider-container { margin-bottom: 15px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
    .value-display { color: #888; font-family: monospace; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 12px 0; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1px; background: #000; }
    input[type=range]::-webkit-slider-thumb { height: 14px; width: 14px; border-radius: 50%; background: #fff; border: 2px solid #000; cursor: pointer; -webkit-appearance: none; margin-top: -7px; }
    .btn-black { background: #000; color: #fff; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    canvas { display: block; }
  </style>
</head>
<body>

<div id="ui-panel">
  <h2>吳沅冠雕塑生成系統</h2>
  <div id="controls-content"></div>
  <button class="btn-black" onclick="randomize()">隨機演化</button>
  <div style="margin-top:20px; font-size:10px; color:#ccc;">RENDER: PLASMA_V4_STABLE</div>
</div>

<script>
let myShader, time = 0, colorTime = 0, forcePoints = [];
let sliders = {};
const DEFAULTS = { baseBright: 0.45, glowBoost: 55, cameraZ: 11.5, speed: 0.016, sat: 1.2, distort: 0.7 };

const vert = `#version 300 es
precision highp float;
in vec3 aPosition;
void main() { gl_Position = vec4(aPosition.xy * 2.0 - 1.0, 0.0, 1.0); }`;

const frag = `#version 300 es
precision highp float;
uniform vec2 r;
uniform float t, ct;
uniform vec3 uRot;
uniform float uBaseBright, uGlowBoost, uCameraZ, uSat, uDistort;
uniform vec3 uForcePos[7];
uniform float uForceStrength[7];
uniform float uForceRadius[7];
out vec4 o;

float hash(vec3 p) {
    p = fract(p * vec3(123.34, 456.21, 789.13));
    p += dot(p, p.yzx + 19.19);
    return fract((p.x + p.y) * p.z);
}
float noise(vec3 p) {
    vec3 i = floor(p); vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i + vec3(0, 0, 0)), hash(i + vec3(1, 0, 0)), f.x),
               mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
               mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
               mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}
mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
vec3 rotate3D(vec3 p, vec3 r_ang) {
    p.yz *= rot(r_ang.x); p.xz *= rot(r_ang.y); p.xy *= rot(r_ang.z);
    return p;
}
vec3 ACESFilm(vec3 x) {
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - r.xy) / r.y;
    o = vec4(0.0);
    float z = 0.0;
    
    // 🌟 行動裝置最佳化：改用 int 迴圈並減少次數 (65次) 確保動畫流暢
    for(int i = 0; i < 65; i++) {
        vec3 p_orig = z * normalize(vec3(uv, 1.8));
        p_orig.z -= uCameraZ; 
        p_orig = rotate3D(p_orig, uRot);
        
        float mD = 1e5;
        for(float j = 1.0; j <= 6.0; j++) {
            vec3 p = p_orig;
            p = rotate3D(p, uRot * (0.4 + j * 0.1) + j * 2.5);
            float theta = atan(p.y, p.x);
            float disto = noise(vec3(p.x * 0.5, p.y * 0.5, t * 0.3 + j)) * uDistort;
            float dynamicR = (2.4 + j * 0.5) + disto + sin(theta * (2.0 + j * 0.2) + t) * 0.2;
            vec2 crossSection = vec2(length(p.xy) - dynamicR, p.z);
            float d_ring = length(crossSection - vec2(sin(theta*2.1 + t), cos(theta*1.8 - t))*2.5) - 0.15;
            mD = smin(mD, d_ring, 0.8);
        }

        float rOffset = 0.0;
        for(int k = 0; k < 7; k++) {
            float dF = length(p_orig - uForcePos[k] * 1.8);
            if(dF < uForceRadius[k] * 1.5) {
                float pct = 1.0 - (dF / (uForceRadius[k] * 1.5));
                rOffset += uForceStrength[k] * 4.0 * pct * pct;
            }
        }

        float d = 0.2 * abs(mD) + 0.02;
        z += d * 0.3; 
        
        float theta_main = atan(p_orig.y, p_orig.x);
        vec3 proceduralCol = cos(theta_main * 1.2 + ct + p_orig.y * 0.2 + vec3(0.0, 1.2, 2.5)) + uSat; 
        
        float plasmaAccum = (z * 0.1 / (d + 0.005)) + uBaseBright; 
        vec3 AccColor = (proceduralCol * plasmaAccum * 18.0) + (proceduralCol * rOffset * 0.2 * uGlowBoost);
        o += vec4(AccColor, 1.0); 
    }

    o.rgb = ACESFilm(o.rgb / 3.0e4);
}`;

function buildUI() {
    const container = document.getElementById('controls-content');
    const config = [
        { id: 'baseBright', label: '全局基礎亮度', min: 0.01, max: 2.0, step: 0.01 },
        { id: 'glowBoost', label: '高光發射強度', min: 0, max: 150, step: 1 },
        { id: 'cameraZ', label: '觀察焦距 (Z)', min: 5, max: 20, step: 0.5 },
        { id: 'speed', label: '流轉演化速度', min: 0, max: 0.08, step: 0.001 },
        { id: 'distort', label: '有機扭曲權重', min: 0, max: 2.0, step: 0.1 },
        { id: 'sat', label: '彩虹飽和補償', min: 0.5, max: 3.0, step: 0.1 }
    ];
    config.forEach(c => {
        let box = document.createElement('div');
        box.className = 'slider-container';
        box.innerHTML = `<div class="slider-header"><span>${c.label}</span><span id="v-${c.id}" class="value-display">${DEFAULTS[c.id]}</span></div>
            <input type="range" id="sl-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${DEFAULTS[c.id]}">`;
        container.appendChild(box);
        let el = document.getElementById(`sl-${c.id}`);
        sliders[c.id] = el;
        el.oninput = () => document.getElementById(`v-${c.id}`).innerText = el.value;
    });
}

function randomize() {
    Object.keys(sliders).forEach(k => {
        let val = random(parseFloat(sliders[k].min), parseFloat(sliders[k].max));
        sliders[k].value = val.toFixed(3);
        document.getElementById(`v-${k}`).innerText = sliders[k].value;
    });
}

function setup() {
    let canvas = createCanvas(windowWidth - 320, windowHeight, WEBGL);
    canvas.position(320, 0);
    buildUI();
    myShader = createShader(vert, frag);
    for (let i = 0; i < 7; i++) {
        forcePoints.push({ pos: createVector(0,0,0), angle: random(TAU), isPermanent: i < 3, strength: 0, radius: random(200, 350), angleVel: random(0.01, 0.04) });
    }
}

function draw() {
    background(0);
    let dt = parseFloat(sliders.speed.value);
    time += dt; colorTime += dt * 2.0;

    forcePoints.forEach(fp => {
        fp.angle += fp.angleVel;
        fp.pos.x = 230 * cos(fp.angle); fp.pos.y = 230 * sin(fp.angle);
        fp.strength = fp.isPermanent ? 150 : 80;
    });

    shader(myShader);
    myShader.setUniform('r', [width, height]);
    myShader.setUniform('t', time);
    myShader.setUniform('ct', colorTime);
    myShader.setUniform('uRot', [frameCount * 0.006, frameCount * 0.004, frameCount * 0.002]);
    myShader.setUniform('uBaseBright', parseFloat(sliders.baseBright.value));
    myShader.setUniform('uGlowBoost', parseFloat(sliders.glowBoost.value));
    myShader.setUniform('uCameraZ', parseFloat(sliders.cameraZ.value));
    myShader.setUniform('uSat', parseFloat(sliders.sat.value));
    myShader.setUniform('uDistort', parseFloat(sliders.distort.value));

    let fPos = [], fStr = [], fRad = [];
    forcePoints.forEach(fp => {
        fPos.push(fp.pos.x * 0.02, fp.pos.y * 0.02, fp.pos.z * 0.02);
        fStr.push(fp.strength * 0.0016); fRad.push(fp.radius * 0.012);
    });
    myShader.setUniform('uForcePos', fPos);
    myShader.setUniform('uForceStrength', fStr);
    myShader.setUniform('uForceRadius', fRad);

    rect(-width / 2, -height / 2, width, height);
}
function windowResized() { resizeCanvas(windowWidth - 320, windowHeight); }
</script>
</body>
</html>
