<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式按鈕範例</title>
    <style>
        /* CSS 部分 */

        /* 基本頁面樣式，佔滿全螢幕且不包含側邊欄 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* 內容置中 */
            align-items: center;    /* 內容置中 */
            min-height: 100vh;
            background-color: #f0f2f5; /* 淺灰色背景 */
        }

        /* 按鈕容器樣式 */
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 80%; /* 寬度佔頁面 80% */
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        /* 按鈕群組的網格佈局，使按鈕對齊 */
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 兩欄 */
            gap: 20px; /* 按鈕間距 */
        }

        /* 基本按鈕樣式 */
        .action-button {
            padding: 15px 25px;
            font-size: 16px;
            color: white;
            background-color: #007bff; /* 藍色 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s; /* 平滑過渡效果 */
            outline: none; /* 移除點擊時的藍色邊框 */
        }

        /* 滑鼠懸停時的樣式 */
        .action-button:hover {
            background-color: #0056b3; /* 更深的藍色 */
        }

        /* * === 按鈕點擊「閃一下」的核心 CSS ===
         */

        /* 定義「閃爍」動畫 */
        @keyframes flash {
            0% {
                background-color: #007bff; /* 初始藍色 */
            }
            50% {
                background-color: #99cfff; /* 閃爍時變為淺藍色 */
            }
            100% {
                background-color: #007bff; /* 恢復初始藍色 */
            }
        }

        /* 用於觸發動畫的類別 */
        .is-flashing {
            animation: flash 0.3s ease; /* 播放 0.3 秒的閃爍動畫 */
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>我的 V-GPT</h1>
        <p>選擇一個選項開始：</p>
        
        <div class="button-group">
            <button class="action-button">創作圖像</button>
            <button class="action-button">思考</button>
            <button class="action-button">深入研究</button>
            <button class="action-button">更多</button>
        </div>
    </div>

    <script>
        // 取得所有具有 'action-button' 類別的按鈕
        const buttons = document.querySelectorAll('.action-button');

        // 迭代每個按鈕並添加點擊事件監聽器
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                // 1. 添加 'is-flashing' 類別來觸發 CSS 動畫
                button.classList.add('is-flashing');

                // 2. 使用 setTimeout 在動畫完成後移除該類別
                // 延遲時間（這裡設置為 300 毫秒）應與 CSS 動畫持續時間一致
                setTimeout(() => {
                    button.classList.remove('is-flashing');
                }, 300); // 300 毫秒後移除
            });
        });
    </script>

</body>
</html>
