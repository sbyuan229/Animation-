<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spectacle - 資訊奇觀</title>
    <style>
        /* 基礎設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #212121;
            color: #ECECEC;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側導覽列 */
        .side-rail {
            width: 60px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #333;
        }

        .side-rail .icon {
            width: 32px;
            height: 32px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #b4b4b4;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .side-rail .icon:hover { background-color: #2f2f2f; color: #fff; }

        /* 主要內容區 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部資訊列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        /* ====== 左上角模型選擇器與下拉選單 ====== */
        .model-selector-wrapper {
            position: relative;
        }

        .model-selector {
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            color: #ececec;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        
        .model-selector:hover {
            background-color: #2f2f2f;
        }

        /* 仿造截圖的下拉選單 */
        .model-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 5px;
            background-color: #2f2f2f;
            border-radius: 16px;
            padding: 12px;
            width: 340px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            z-index: 200;
        }

        .model-menu.show {
            display: block;
            animation: fadeIn 0.15s ease-out;
        }

        .model-menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: default; /* 這裡只是展示，不設定為手指 */
            transition: background-color 0.2s;
        }

        .model-menu-item:hover {
            background-color: #404040;
        }

        .model-menu-icon {
            color: #b4b4b4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-menu-icon svg { width: 24px; height: 24px; }

        .model-menu-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .model-menu-name {
            font-size: 15px;
            color: #ececec;
            font-weight: 500;
        }

        .model-menu-desc {
            font-size: 13px;
            color: #b4b4b4;
        }

        /* 贊助按鈕 */
        .top-bar .donate-btn {
            background-color: #3b3b4f;
            color: #d1d5db;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .top-bar .donate-btn:hover { 
            opacity: 0.9;
            background-color: #4a4a6a; 
        }
        
        .top-bar .right-icons {
            display: flex;
            gap: 15px;
            color: #ececec;
            cursor: pointer;
        }

        /* 中央舞台 */
        .center-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .center-stage h1 {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 40px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        /* ====== 底部輸入列與附加浮窗 ====== */
        .input-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            position: relative;
        }

        .attach-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 20px;
            background-color: #2f2f2f;
            border-radius: 16px;
            padding: 8px 0;
            width: 240px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            z-index: 100;
            flex-direction: column;
        }

        .attach-menu.show {
            display: flex;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #ececec;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        .menu-item:hover { background-color: #404040; }
        .menu-item svg { width: 20px; height: 20px; color: #b4b4b4; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .menu-divider { height: 1px; background-color: #444; margin: 6px 16px; }
        .menu-item .arrow-right { margin-left: auto; width: 16px; height: 16px; }

        /* 輸入框本體 */
        .input-box {
            background-color: #2f2f2f;
            border-radius: 25px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .icon-btn {
            background: none;
            border: none;
            color: #b4b4b4;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover { background-color: #404040; color: #fff; }
        .icon-btn.recording { color: #ff4a4a; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ECECEC;
            font-size: 16px;
            outline: none;
        }

        .input-box input::placeholder { color: #8e8ea0; }
        svg { width: 20px; height: 20px; fill: currentColor; }

    </style>
</head>
<body>

    <nav class="side-rail">
        <div class="icon" title="新對話">
            <svg viewBox="0 0 24 24"><path d="M12 4v16m-8-8h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div class="icon" title="搜尋" onclick="window.open('https://www.google.com', '_blank')">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            
            <div class="model-selector-wrapper">
                <div class="model-selector" id="vgpt-title">
                    V-GPT <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                </div>
                <div class="model-menu" id="model-menu">
                    <div class="model-menu-item">
                        <div class="model-menu-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18m-9-9h18M19 5l-2 2M5 19l2-2M5 5l2 2m12 12l-2-2"/></svg>
                        </div>
                        <div class="model-menu-text">
                            <div class="model-menu-name">Video Generative Pre-trained Transformer</div>
                            <div class="model-menu-desc">影片生成預訓練模型</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="donate-btn" onclick="alert('跳轉至贊助頁面...')">
                ✨ 贊助作者
            </button>
            <div class="right-icons">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
            </div>
        </header>

        <section class="center-stage" id="canvas-container">
            <h1 id="greeting-text">我們該從哪裡開始？</h1>
        </section>

        <footer class="input-container">
            
            <div class="attach-menu" id="attach-menu">
                <div class="menu-item" id="menu-upload">
                    <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    新增照片和檔案
                </div>
                <div class="menu-divider"></div>
                <div class="menu-item" id="menu-create">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    創作圖像
                </div>
                <div class="menu-item" id="menu-think">
                    <svg viewBox="0 0 24 24"><path d="M9 18h6m-3-13v2m-5.657.343l1.414 1.414m8.486 0l1.414-1.414M6 12h2m8 0h2M9 22h6c1.105 0 2-.895 2-2H7c0 1.105.895 2 2 2z"/><circle cx="12" cy="11" r="5"/></svg>
                    思考
                </div>
                <div class="menu-item" id="menu-research">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><path d="M11 8v6l4 2"/></svg>
                    深入研究
                </div>
                <div class="menu-item" id="menu-more">
                    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
                    更多
                    <svg class="arrow-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
            </div>

            <div class="input-box">
                <button class="icon-btn" id="plus-btn" title="附加">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <input type="file" id="file-upload" hidden accept="image/*">
                
                <input type="text" id="user-input" placeholder="想問就問">
                
                <button class="icon-btn" id="mic-btn" title="語音輸入">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
            </div>
        </footer>
    </main>

    <script>
        const inputField = document.getElementById('user-input');
        const greetingText = document.getElementById('greeting-text');
        const micBtn = document.getElementById('mic-btn');
        
        // 浮窗與按鈕元素
        const plusBtn = document.getElementById('plus-btn');
        const attachMenu = document.getElementById('attach-menu');
        const fileUpload = document.getElementById('file-upload');
        
        const vgptTitle = document.getElementById('vgpt-title');
        const modelMenu = document.getElementById('model-menu');
        
        const menuUpload = document.getElementById('menu-upload');
        const menuCreate = document.getElementById('menu-create');
        const menuThink = document.getElementById('menu-think');
        const menuResearch = document.getElementById('menu-research');
        const menuMore = document.getElementById('menu-more');

        // 更新中央文字的通用函數
        function changeGreetingText(text) {
            greetingText.style.display = 'block';
            greetingText.innerText = text;
            attachMenu.classList.remove('show');
        }

        // 綁定底部選單嘲諷文字事件
        menuCreate.addEventListener('click', () => changeGreetingText('Ai不能創作'));
        menuThink.addEventListener('click', () => changeGreetingText('Ai不會思考'));
        menuResearch.addEventListener('click', () => changeGreetingText('請自己研究'));
        menuMore.addEventListener('click', () => changeGreetingText('沒有更多'));

        // V-GPT 下拉選單開關邏輯
        vgptTitle.addEventListener('click', (e) => {
            e.stopPropagation();
            modelMenu.classList.toggle('show');
            attachMenu.classList.remove('show'); // 開啟上方選單時，收合下方選單
        });

        // 附加按鈕選單開關邏輯
        plusBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            attachMenu.classList.toggle('show');
            modelMenu.classList.remove('show'); // 開啟下方選單時，收合上方選單
        });

        // 點擊空白處自動收合所有選單
        document.addEventListener('click', (e) => {
            if (!attachMenu.contains(e.target) && !plusBtn.contains(e.target)) {
                attachMenu.classList.remove('show');
            }
            if (!modelMenu.contains(e.target) && !vgptTitle.contains(e.target)) {
                modelMenu.classList.remove('show');
            }
        });

        // 檔案上傳邏輯
        menuUpload.addEventListener('click', () => {
            attachMenu.classList.remove('show');
            fileUpload.click();
        });

        fileUpload.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const fileName = this.files[0].name;
                console.log("用戶上傳了:", fileName);
                changeGreetingText("正在解構圖片...");
            }
        });

        // 文字輸入邏輯
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                console.log("用戶輸入了:", this.value);
                changeGreetingText("無法處理輸入。");
                this.value = '';
            }
        });

        // 語音輸入邏輯
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
            });

            recognition.addEventListener('audiostart', () => {
                micBtn.classList.add('recording');
                inputField.placeholder = "正在聆聽...";
            });

            recognition.addEventListener('result', (e) => {
                const transcript = e.results[0][0].transcript;
                inputField.value += transcript;
            });

            recognition.addEventListener('audioend', () => {
                micBtn.classList.remove('recording');
                inputField.placeholder = "想問就問";
            });

            recognition.addEventListener('error', (e) => {
                micBtn.classList.remove('recording');
                inputField.placeholder = "想問就問";
            });
        } else {
            micBtn.addEventListener('click', () => {
                changeGreetingText('語音模組已損壞');
            });
        }
    </script>
</body>
</html>
