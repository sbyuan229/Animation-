<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Spectacle - 資訊奇觀</title>
    <style>
        /* ====== 基礎設定 ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #212121; color: #ECECEC; display: flex; height: 100vh; overflow: hidden; height: 100dvh; }

        /* ====== 主要內容區 ====== */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            padding-bottom: 70px; 
        }

        /* ====== 頂部資訊列 ====== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: relative; z-index: 10; background-color: #212121; }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .hamburger-menu { display: none; cursor: pointer; color: #ececec; }
        .model-selector-wrapper { position: relative; z-index: 200; }
        .model-selector { font-size: 18px; font-weight: 600; cursor: pointer; color: #ececec; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; transition: background 0.2s; }
        .model-selector:hover { background-color: #2f2f2f; }
        .model-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 5px; background-color: #2f2f2f; border-radius: 16px; padding: 12px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .model-menu.show { display: block; animation: fadeIn 0.15s ease-out; }
        
        .top-bar-center { position: absolute; left: 50%; transform: translateX(-50%); z-index: 100; transition: opacity 0.3s; }
        .donate-btn { background-color: #3b3b4f; color: #d1d5db; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .right-icons { display: flex; gap: 15px; color: #ececec; cursor: pointer; }

        /* ====== 中央舞台 (捲動區) ====== */
        .center-stage { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
            scroll-behavior: smooth;
        }

        .greeting-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        .center-stage h1 { font-size: 32px; font-weight: 500; letter-spacing: 1px; transition: opacity 0.2s ease; }

        /* ====== 對話流設計 ====== */
        .chat-feed { display: none; width: 100%; max-width: 800px; padding: 40px 20px 80px 20px; flex-direction: column; gap: 32px; }
        .message-row { display: flex; width: 100%; }
        .user-row { justify-content: flex-end; }
        .user-msg { background: #2f2f2f; color: #ececec; padding: 12px 18px; border-radius: 20px; font-size: 16px; max-width: 80%; word-break: break-all; }

        .ai-row { justify-content: flex-start; flex-direction: column; }
        .ai-msg-content { position: relative; color: #ececec; font-size: 16px; line-height: 1.7; max-width: 100%; word-break: break-all; white-space: pre-wrap; }
        .ai-msg-content span { display: inline; transition: opacity 0.2s ease; }
        
        .swap-clone {
            position: absolute;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: none; 
            z-index: 10;
            color: #ffffff; 
            background-color: #212121; 
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }

        /* 動作按鈕樣式 */
        .ai-actions { display: flex; gap: 8px; margin-top: 12px; opacity: 0; transition: opacity 0.3s ease; }
        .ai-action-btn { background: none; border: none; color: #b4b4b4; cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s; }
        .ai-action-btn:hover { background-color: #2f2f2f; color: #ececec; }
        .ai-action-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ai-action-btn.filled { color: #ececec; }
        .ai-action-btn.filled svg { fill: currentColor; }

        /* ====== 向下跳轉箭頭 ====== */
        @keyframes floatUpDown {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); } 
        }
        .scroll-down-btn { 
            position: absolute; 
            bottom: 110px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            background-color: #2f2f2f; 
            border: 1px solid #444; 
            color: #ececec; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 150; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            animation: floatUpDown 2s ease-in-out infinite; 
        }

        /* ====== 底部輸入列 ====== */
        .input-container { 
            position: fixed; 
            bottom: 0;
            width: 100%; 
            max-width: 800px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 0 20px 20px 20px; 
            z-index: 200; 
            background-color: #212121; 
        }
        .input-box { background-color: #2f2f2f; border-radius: 25px; padding: 10px 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .icon-btn { background: none; border: none; color: #b4b4b4; cursor: pointer; display: flex; justify-content: center; align-items: center; width: 32px; height: 32px; border-radius: 50%; transition: background 0.2s, color 0.2s; }
        .input-box input { flex: 1; background: transparent; border: none; color: #ECECEC; font-size: 16px; outline: none; min-width: 0; }
        
        #send-btn { background-color: #ececec; color: #212121; display: flex; align-items: center; justify-content: center; }
        #send-btn svg { width: 18px; height: 18px; transform: translate(-1px, 1px); }

        .attach-menu { display: none; position: absolute; bottom: calc(100% + 10px); left: 20px; background-color: #2f2f2f; border-radius: 16px; padding: 8px 0; width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 100; flex-direction: column; }
        .attach-menu.show { display: flex; animation: fadeIn 0.15s ease-out; }
        .menu-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #ececec; font-size: 15px; }

        /* ====== 手機版適配 ====== */
        @media (max-width: 768px) {
            .top-bar-center, .right-icons { display: none !important; }
            .scroll-down-btn { bottom: 125px; }
            .input-container { padding: 0 16px 16px 16px; }
            .input-box input { font-size: 17px; }
            .main-content { padding-bottom: 90px; } 
            .ai-actions { gap: 4px; } /* 手機版按鈕間距稍微縮小 */
        }
    </style>
</head>
<body>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="model-selector-wrapper">
                    <div class="model-selector" id="vgpt-title">
                        V-GPT <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    </div>
                    <div class="model-menu" id="model-menu">
                        <div style="padding: 12px; color: #ececec;">Video Generative Transformer</div>
                    </div>
                </div>
            </div>
            <div class="top-bar-center" id="top-sponsor"><button class="donate-btn">✨ 贊助作者</button></div>
            <div class="right-icons" id="top-icons"><svg style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg></div>
        </header>

        <section class="center-stage" id="center-stage">
            <div class="greeting-container" id="greeting-container">
                <h1 id="greeting-text">我們該從哪裡開始？</h1>
            </div>
            <div class="chat-feed" id="chat-feed"></div>
        </section>

        <button class="scroll-down-btn" id="scroll-down-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></button>

        <footer class="input-container">
            <div class="attach-menu" id="attach-menu">
                <div class="menu-item" id="menu-upload">新增照片和檔案</div>
                <div class="menu-item" id="menu-create">創作圖像</div>
                <div class="menu-item" id="menu-think">思考</div>
                <div class="menu-item" id="menu-research">深入研究</div>
                <div class="menu-item" id="menu-more">更多</div>
            </div>

            <div class="input-box">
                <button class="icon-btn" id="plus-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg></button>
                <input type="text" id="user-input" placeholder="想問就問">
                <button class="icon-btn" id="mic-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
                <button class="icon-btn" id="send-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
            </div>
        </footer>
    </main>

    <script>
        const inputField = document.getElementById('user-input');
        const centerStage = document.getElementById('center-stage');
        const greetingContainer = document.getElementById('greeting-container');
        const greetingText = document.getElementById('greeting-text');
        const chatFeed = document.getElementById('chat-feed');
        const scrollBtn = document.getElementById('scroll-down-btn');
        const sendBtn = document.getElementById('send-btn');
        const plusBtn = document.getElementById('plus-btn');
        const attachMenu = document.getElementById('attach-menu');

        let historyText = ""; 
        let totalGeneratedChars = 0; 

        //選單控制
        plusBtn.addEventListener('click', (e) => { e.stopPropagation(); attachMenu.classList.toggle('show'); });
        document.addEventListener('click', () => attachMenu.classList.remove('show'));

        function handleMenuClick(text) {
            if (greetingContainer.style.display !== 'none') {
                greetingText.innerText = text;
            } else {
                inputField.value += text;
            }
        }
        document.getElementById('menu-upload').addEventListener('click', () => handleMenuClick('無法上傳檔案'));
        document.getElementById('menu-create').addEventListener('click', () => handleMenuClick('Ai不能創作'));
        document.getElementById('menu-think').addEventListener('click', () => handleMenuClick('Ai不會思考'));
        document.getElementById('menu-research').addEventListener('click', () => handleMenuClick('請自己研究'));
        document.getElementById('menu-more').addEventListener('click', () => handleMenuClick('沒有更多'));

        // 動作按鈕生成邏輯
        function addAiActions(parentRow, spans) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'ai-actions';
            actionsDiv.innerHTML = `
                <button class="ai-action-btn copy-btn" title="複製"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                <button class="ai-action-btn redo-btn" title="重新產生"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg></button>
                <button class="ai-action-btn like-btn" title="好回應"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg></button>
                <button class="ai-action-btn dislike-btn" title="壞回應"><svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg></button>
            `;
            parentRow.appendChild(actionsDiv);
            setTimeout(() => { actionsDiv.style.opacity = '1'; }, 50);

            actionsDiv.querySelector('.copy-btn').addEventListener('click', () => {
                const fullText = spans.map(s => s.textContent).join('');
                navigator.clipboard.writeText(fullText).then(() => alert('已複製內容'));
            });
            actionsDiv.querySelector('.redo-btn').addEventListener('click', () => {
                parentRow.remove();
                generateAiResponse();
            });
        }

        function generateChaosString() {
            if(historyText.length === 0) return "無效輸入。";
            const numLines = Math.floor(Math.random() * 30) + 2; 
            let raw = "";
            for (let i = 0; i < numLines; i++) {
                let line = "";
                while (line.length < 20) {
                    let start = Math.floor(Math.random() * historyText.length);
                    line += historyText.substring(start, start + 2);
                }
                raw += line + "\n";
            }
            return raw;
        }

        function processUserInput(text) {
            if (text.trim() === '') return;
            historyText += text.replace(/\s+/g, ''); 
            greetingContainer.style.display = 'none';
            chatFeed.style.display = 'flex';
            const userRow = document.createElement('div');
            userRow.className = 'message-row user-row';
            userRow.innerHTML = `<div class="user-msg">${text}</div>`;
            chatFeed.appendChild(userRow);
            scrollToBottom();
            generateAiResponse();
        }

        function triggerSwapAnimation(span1, span2, aiContent) {
            if (span1.textContent === '\n' || span2.textContent === '\n' || span1.dataset.isSwapping || span2.dataset.isSwapping) return;
            span1.dataset.isSwapping = "true"; span2.dataset.isSwapping = "true";
            const x1 = span1.offsetLeft, y1 = span1.offsetTop, x2 = span2.offsetLeft, y2 = span2.offsetTop;
            const c1 = document.createElement('span'), c2 = document.createElement('span');
            c1.textContent = span1.textContent; c1.className = 'swap-clone'; c1.style.left = x1+'px'; c1.style.top = y1+'px';
            c2.textContent = span2.textContent; c2.className = 'swap-clone'; c2.style.left = x2+'px'; c2.style.top = y2+'px';
            aiContent.appendChild(c1); aiContent.appendChild(c2);
            span1.style.opacity = '0'; span2.style.opacity = '0';
            void c1.offsetWidth;
            c1.style.left = x2+'px'; c1.style.top = y2+'px';
            c2.style.left = x1+'px'; c2.style.top = y1+'px';
            setTimeout(() => {
                let t = span1.textContent; span1.textContent = span2.textContent; span2.textContent = t;
                span1.style.opacity = '1'; span2.style.opacity = '1';
                c1.remove(); c2.remove();
                delete span1.dataset.isSwapping; delete span2.dataset.isSwapping;
            }, 1200);
        }

        function generateAiResponse() {
            const aiRow = document.createElement('div'); aiRow.className = 'message-row ai-row';
            const aiContent = document.createElement('div'); aiContent.className = 'ai-msg-content';
            aiRow.appendChild(aiContent); chatFeed.appendChild(aiRow);
            const chaosString = generateChaosString();
            let currentSpans = [], i = 0;
            function typeChar() {
                if (i < chaosString.length) {
                    const span = document.createElement('span');
                    span.textContent = chaosString[i]; aiContent.appendChild(span); currentSpans.push(span);
                    if (Math.random() < 0.1 && currentSpans.length > 5) {
                        let idx1 = Math.floor(Math.random() * currentSpans.length);
                        let idx2 = (idx1 + 1) % currentSpans.length;
                        triggerSwapAnimation(currentSpans[idx1], currentSpans[idx2], aiContent);
                    }
                    i++;
                    if (centerStage.scrollHeight - centerStage.scrollTop <= centerStage.clientHeight + 100) scrollToBottom();
                    setTimeout(typeChar, 30);
                } else {
                    // 打字結束後，新增功能按鈕
                    addAiActions(aiRow, currentSpans);
                }
            }
            typeChar();
        }

        function scrollToBottom() { centerStage.scrollTo({ top: centerStage.scrollHeight, behavior: 'smooth' }); }
        centerStage.addEventListener('scroll', () => {
            const isAtBottom = centerStage.scrollHeight - centerStage.scrollTop <= centerStage.clientHeight + 15; 
            scrollBtn.style.display = isAtBottom ? 'none' : 'flex';
        });
        scrollBtn.addEventListener('click', scrollToBottom);
        sendBtn.addEventListener('click', () => { if (inputField.value.trim() !== '') { processUserInput(inputField.value); inputField.value = ''; } });
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter' && inputField.value.trim() !== '') { processUserInput(inputField.value); inputField.value = ''; } });
    </script>
</body>
</html>
