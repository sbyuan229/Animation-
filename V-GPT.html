<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V-GTP</title>
    <style>
        /* ====== 基礎設定 ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #212121; color: #ECECEC; display: flex; height: 100vh; overflow: hidden; height: 100dvh; }

        /* ====== 主要內容區 ====== */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            padding-bottom: 70px; 
        }

        /* ====== 頂部資訊列 ====== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: relative; z-index: 10; background-color: #212121; }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .top-bar-right { display: flex; align-items: center; z-index: 100; }
        
        .hamburger-menu { display: none !important; }

        .model-selector-wrapper { position: relative; z-index: 200; }
        .model-selector { font-size: 18px; font-weight: 600; cursor: pointer; color: #ececec; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; transition: background 0.2s; }
        .model-selector:hover { background-color: #2f2f2f; }
        .model-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 5px; background-color: #2f2f2f; border-radius: 16px; padding: 12px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05); }
        .model-menu.show { display: block; animation: fadeIn 0.15s ease-out; }
        .model-menu-item { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 12px; cursor: default; transition: background 0.2s; }
        .model-menu-item:hover { background-color: #404040; }
        .model-menu-icon { color: #b4b4b4; display: flex; align-items: center; justify-content: center; }
        .model-menu-icon svg { width: 24px; height: 24px; fill: none; }
        .model-menu-text { display: flex; flex-direction: column; gap: 4px; }
        .model-menu-name { font-size: 15px; color: #ececec; font-weight: 500; }
        .model-menu-desc { font-size: 13px; color: #b4b4b4; }
        
        .donate-btn { background-color: #3b3b4f; color: #d1d5db; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s, background 0.2s, transform 0.1s; }
        .donate-btn:hover { opacity: 0.9; background-color: #4a4a6a; }
        .donate-btn:active { transform: scale(0.97); }

        /* ====== 中央舞台 (捲動區) ====== */
        .center-stage { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
            scroll-behavior: smooth;
        }

        .greeting-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        .center-stage h1 { font-size: 32px; font-weight: 500; letter-spacing: 1px; transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease; }

        /* ====== 對話流設計 ====== */
        .chat-feed { display: none; width: 100%; max-width: 800px; padding: 40px 20px 80px 20px; flex-direction: column; gap: 32px; }
        .message-row { display: flex; width: 100%; }
        
        .user-row { justify-content: flex-end; }
        .user-msg { background: #2f2f2f; color: #ececec; padding: 12px 18px; border-radius: 20px; font-size: 16px; max-width: 80%; word-break: break-all; }
        .user-msg img { max-width: 150px; max-height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; border: 1px solid #444; }

        .ai-row { justify-content: flex-start; flex-direction: column; }
        .ai-msg-content { position: relative; color: #ececec; font-size: 16px; line-height: 1.7; max-width: 100%; word-break: break-all; white-space: pre-wrap; }
        .ai-msg-content span { display: inline; transition: opacity 0.2s ease; }
        
        .image-wrapper { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }

        .swap-clone {
            position: absolute;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: none; 
            z-index: 10;
            color: #ffffff; 
            background-color: #212121; 
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }

        .ai-actions { display: flex; gap: 8px; margin-top: 12px; opacity: 0; transition: opacity 0.3s ease; }
        .ai-action-btn { background: none; border: none; color: #b4b4b4; cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s; }
        .ai-action-btn:hover { background-color: #2f2f2f; color: #ececec; }
        .ai-action-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .ai-action-btn.filled { color: #ececec; }
        .ai-action-btn.filled svg { fill: currentColor; }
        .ai-action-btn.playing { color: #57ff57; }

        /* ====== 向下跳轉箭頭 ====== */
        @keyframes floatUpDown {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); } 
        }

        .scroll-down-btn { 
            position: absolute; 
            bottom: 110px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 32px; height: 32px; border-radius: 50%; 
            background-color: #2f2f2f; border: 1px solid #444; 
            color: #ececec; display: none; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 150; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            animation: floatUpDown 2s ease-in-out infinite; 
        }
        .scroll-down-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* ====== 底部輸入列 ====== */
        .input-container { 
            position: fixed; bottom: 0; width: 100%; max-width: 800px; left: 50%;
            transform: translateX(-50%); padding: 0 20px 20px 20px; z-index: 200; background-color: #212121; 
        }
        
        .attach-menu { display: none; position: absolute; bottom: calc(100% + 10px); left: 20px; background-color: #2f2f2f; border-radius: 16px; padding: 8px 0; width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05); z-index: 100; flex-direction: column; }
        .attach-menu.show { display: flex; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .menu-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #ececec; font-size: 15px; transition: background-color 0.1s; }
        .menu-item:hover { background-color: #404040; }
        @keyframes flashEffect { 0% { background-color: #2f2f2f; } 50% { background-color: #666666; } 100% { background-color: #404040; } }
        .menu-item.flash-active { animation: flashEffect 0.2s ease-out; background-color: #666666 !important; }
        .menu-item svg { width: 20px; height: 20px; color: #b4b4b4; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .menu-divider { height: 1px; background-color: #444; margin: 6px 16px; }

        .input-box { 
            background-color: #2f2f2f; border-radius: 25px; padding: 10px 15px; 
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        
        .preview-area { display: none; gap: 10px; padding-bottom: 4px; padding-left: 4px; }
        .preview-item { position: relative; width: 64px; height: 64px; border-radius: 12px; background-size: cover; background-position: center; border: 1px solid #444; }
        .preview-delete { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; background: #444; color: #ececec; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .preview-item:hover .preview-delete { display: flex; }

        .input-row { display: flex; align-items: center; gap: 8px; width: 100%; }
        
        .mode-badge { display: none; align-items: center; gap: 6px; color: #8ab4f8; background: rgba(138, 180, 248, 0.15); padding: 4px 12px; border-radius: 16px; font-size: 14px; white-space: nowrap; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .mode-badge:hover { background: rgba(138, 180, 248, 0.25); }
        .mode-badge svg { width: 16px; height: 16px; fill: currentColor; }

        .icon-btn { background: none; border: none; color: #b4b4b4; cursor: pointer; display: flex; justify-content: center; align-items: center; width: 32px; height: 32px; border-radius: 50%; transition: background 0.2s, color 0.2s; }
        .icon-btn:hover { background-color: #404040; color: #fff; }
        .input-row input { flex: 1; background: transparent; border: none; color: #ECECEC; font-size: 16px; outline: none; min-width: 0; }
        .input-row input::placeholder { color: #8e8ea0; }
        svg { width: 20px; height: 20px; fill: currentColor; }
        
        #send-btn { background-color: #ececec; color: #212121; display: flex; align-items: center; justify-content: center; padding: 0; }
        #send-btn:hover { background-color: #ffffff; }
        #send-btn svg { width: 18px; height: 18px; transform: translate(-1px, 1px); }

        /* ====== 手機版適配 ====== */
        @media (max-width: 768px) {
            .top-bar { padding: 12px 16px; }
            .top-bar-left { gap: 16px; }
            .hamburger-menu { display: none !important; }
            .model-selector { font-size: 20px; padding: 4px 8px; }
            .center-stage h1 { font-size: 28px; font-weight: 600; }
            .chat-feed { padding: 20px 16px 60px 16px; gap: 24px;}
            .scroll-down-btn { width: 36px; height: 36px; bottom: 125px; }
            .input-container { padding: 0 16px 16px 16px; margin-bottom: 0; }
            .input-box { padding: 8px 12px; border-radius: 30px; gap: 6px; }
            .input-row input { font-size: 17px; }
            .attach-menu { width: calc(100vw - 32px); left: 16px; bottom: calc(100% + 12px); }
            .model-menu { width: 280px; }
            #mic-btn { width: 32px; height: 32px; border-radius: 50%; padding: 0; background-color: transparent; }
            #mic-btn::after { display: none; }
            .main-content { padding-bottom: 90px; } 
            .preview-delete { display: flex; width: 24px; height: 24px; top: -8px; right: -8px; }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="model-selector-wrapper">
                    <div class="model-selector" id="vgpt-title">
                        V-GPT <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
                    </div>
                    <div class="model-menu" id="model-menu">
                        <div class="model-menu-item">
                            <div class="model-menu-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18m-9-9h18M19 5l-2 2M5 19l2-2M5 5l2 2m12 12l-2-2"/></svg></div>
                            <div class="model-menu-text">
                                <div class="model-menu-name">Video Generative Pre-trained Transformer</div>
                                <div class="model-menu-desc">影片生成預訓練模型</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="top-bar-right" id="top-sponsor">
                <button class="donate-btn" onclick="window.open('https://www.instagram.com/_yuan.k/', '_blank')">✨ 追蹤作者</button>
            </div>
        </header>

        <section class="center-stage" id="center-stage">
            <div class="greeting-container" id="greeting-container">
                <h1 id="greeting-text">我們該從哪裡開始？</h1>
            </div>
            <div class="chat-feed" id="chat-feed"></div>
        </section>

        <button class="scroll-down-btn" id="scroll-down-btn">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <footer class="input-container">
            <div class="attach-menu" id="attach-menu">
                <div class="menu-item" id="menu-upload"><svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>新增照片和檔案</div>
                <div class="menu-divider"></div>
                <div class="menu-item" id="menu-create"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>創作圖像</div>
                <div class="menu-item" id="menu-think"><svg viewBox="0 0 24 24"><path d="M9 18h6m-3-13v2m-5.657.343l1.414 1.414m8.486 0l1.414-1.414M6 12h2m8 0h2M9 22h6c1.105 0 2-.895 2-2H7c0 1.105.895 2 2 2z"/><circle cx="12" cy="11" r="5"/></svg>思考</div>
                <div class="menu-item" id="menu-research"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><path d="M11 8v6l4 2"/></svg>深入研究</div>
                <div class="menu-item" id="menu-more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>更多</div>
            </div>

            <div class="input-box">
                <div class="preview-area" id="preview-area"></div>
                
                <div class="input-row">
                    <button class="icon-btn" id="plus-btn" title="附加"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
                    
                    <div class="mode-badge" id="mode-badge" title="取消圖像模式">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        圖像 <span style="font-size: 14px; margin-left: 4px; font-weight: bold;">×</span>
                    </div>

                    <input type="text" id="user-input" placeholder="想問就問">
                    <button class="icon-btn" id="mic-btn" title="語音輸入"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill: none;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg></button>
                    <button class="icon-btn" id="send-btn" title="發送訊息">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill: none;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </footer>
    </main>

    <input type="file" id="file-upload" accept="image/*,capture=camera" style="display: none;">

    <script>
        const inputField = document.getElementById('user-input');
        const centerStage = document.getElementById('center-stage');
        const greetingContainer = document.getElementById('greeting-container');
        const greetingText = document.getElementById('greeting-text');
        const chatFeed = document.getElementById('chat-feed');
        const scrollBtn = document.getElementById('scroll-down-btn');
        const sendBtn = document.getElementById('send-btn');
        const plusBtn = document.getElementById('plus-btn');
        const attachMenu = document.getElementById('attach-menu');
        const vgptTitle = document.getElementById('vgpt-title');
        const modelMenu = document.getElementById('model-menu');
        const fileUpload = document.getElementById('file-upload');
        const previewArea = document.getElementById('preview-area');
        const modeBadge = document.getElementById('mode-badge');

        let historyText = ""; 
        let uploadedImageSrc = null; 
        let isImageMode = false; 

        vgptTitle.addEventListener('click', (e) => { e.stopPropagation(); modelMenu.classList.toggle('show'); attachMenu.classList.remove('show'); });
        plusBtn.addEventListener('click', (e) => { e.stopPropagation(); attachMenu.classList.toggle('show'); modelMenu.classList.remove('show'); });
        document.addEventListener('click', (e) => {
            if (!attachMenu.contains(e.target) && !plusBtn.contains(e.target)) attachMenu.classList.remove('show');
            if (!modelMenu.contains(e.target) && !vgptTitle.contains(e.target)) modelMenu.classList.remove('show');
        });

        // ======================= 選單點擊處理 (更新邏輯) =======================
        function handleMenuClick(buttonElement, text) {
            buttonElement.classList.add('flash-active');
            setTimeout(() => {
                buttonElement.classList.remove('flash-active');
                attachMenu.classList.remove('show');
                
                if (greetingContainer.style.display !== 'none') {
                    // 1. 若在起始畫面，則替換中間標題
                    greetingText.style.opacity = '0';
                    setTimeout(() => {
                        greetingText.innerText = text;
                        greetingText.style.opacity = '1';
                    }, 200);
                } else {
                    // 2. 若對話已經開始，則直接產生 AI 系統氣泡回覆
                    const aiRow = document.createElement('div'); 
                    aiRow.className = 'message-row ai-row';
                    const aiContent = document.createElement('div'); 
                    aiContent.className = 'ai-msg-content';
                    const span = document.createElement('span');
                    span.textContent = text;
                    aiContent.appendChild(span);
                    aiRow.appendChild(aiContent);
                    chatFeed.appendChild(aiRow);
                    scrollToBottom();
                }
            }, 200); 
        }

        // ======================= 上傳圖片與預覽邏輯 =======================
        document.getElementById('menu-upload').addEventListener('click', (e) => {
            attachMenu.classList.remove('show');
            fileUpload.click(); 
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImageSrc = event.target.result;
                    previewArea.style.display = 'flex';
                    previewArea.innerHTML = `
                        <div class="preview-item" style="background-image: url('${uploadedImageSrc}')">
                            <button class="preview-delete" id="delete-preview-btn" title="移除圖片">✕</button>
                        </div>
                    `;
                    document.getElementById('delete-preview-btn').addEventListener('click', removeImage);
                };
                reader.readAsDataURL(file);
            }
        });

        function removeImage() {
            uploadedImageSrc = null;
            previewArea.style.display = 'none';
            previewArea.innerHTML = '';
            fileUpload.value = ''; 
        }

        // ======================= 生成圖像模式切換邏輯 =======================
        document.getElementById('menu-create').addEventListener('click', (e) => {
            attachMenu.classList.remove('show'); 
            isImageMode = true;
            modeBadge.style.display = 'flex';
            inputField.placeholder = '描述或編輯圖像';
            inputField.focus();
        });

        modeBadge.addEventListener('click', () => {
            isImageMode = false;
            modeBadge.style.display = 'none';
            inputField.placeholder = '想問就問';
        });

        document.getElementById('menu-think').addEventListener('click', (e) => handleMenuClick(e.currentTarget, 'Ai不會思考'));
        document.getElementById('menu-research').addEventListener('click', (e) => handleMenuClick(e.currentTarget, '請自己研究'));
        document.getElementById('menu-more').addEventListener('click', (e) => handleMenuClick(e.currentTarget, '沒有更多'));

        // ======================= 一般文字生成動作列 =======================
        function addTextActions(parentRow, spans) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'ai-actions';
            actionsDiv.innerHTML = `
                <button class="ai-action-btn copy-btn" title="複製"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                <button class="ai-action-btn redo-btn" title="重新產生"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg></button>
                <button class="ai-action-btn like-btn" title="好回應"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg></button>
                <button class="ai-action-btn dislike-btn" title="壞回應"><svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg></button>
                <button class="ai-action-btn speak-btn" title="朗讀"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
            `;
            parentRow.appendChild(actionsDiv);
            setTimeout(() => { actionsDiv.style.opacity = '1'; }, 50);

            const copyBtn = actionsDiv.querySelector('.copy-btn');
            const redoBtn = actionsDiv.querySelector('.redo-btn');
            const likeBtn = actionsDiv.querySelector('.like-btn');
            const dislikeBtn = actionsDiv.querySelector('.dislike-btn');
            const speakBtn = actionsDiv.querySelector('.speak-btn');

            copyBtn.addEventListener('click', () => {
                const fullText = spans.map(s => s.textContent).join('');
                navigator.clipboard.writeText(fullText).then(() => alert('已複製內容'));
            });

            redoBtn.addEventListener('click', () => {
                window.speechSynthesis.cancel();
                parentRow.remove();
                generateAiResponse();
            });

            likeBtn.addEventListener('click', () => {
                if (likeBtn.classList.contains('filled')) likeBtn.classList.remove('filled');
                else { likeBtn.classList.add('filled'); dislikeBtn.classList.remove('filled'); }
            });

            dislikeBtn.addEventListener('click', () => {
                if (dislikeBtn.classList.contains('filled')) dislikeBtn.classList.remove('filled');
                else { dislikeBtn.classList.add('filled'); likeBtn.classList.remove('filled'); }
            });

            speakBtn.addEventListener('click', () => {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    speakBtn.classList.remove('playing');
                    return;
                }
                const fullText = spans.map(s => s.textContent).join('');
                const utterance = new SpeechSynthesisUtterance(fullText);
                utterance.lang = 'zh-TW';
                utterance.onstart = () => speakBtn.classList.add('playing');
                utterance.onend = () => speakBtn.classList.remove('playing');
                window.speechSynthesis.speak(utterance);
            });
        }

        // ======================= 圖像生成專屬動作列 =======================
        function addImageActions(parentRow, canvas, originalText, originalImgSrc) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'ai-actions';
            actionsDiv.innerHTML = `
                <button class="ai-action-btn redo-btn" title="重新產生"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg></button>
                <button class="ai-action-btn download-btn" title="儲存圖片"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
                <button class="ai-action-btn like-btn" title="好回應"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg></button>
                <button class="ai-action-btn dislike-btn" title="壞回應"><svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg></button>
            `;
            parentRow.appendChild(actionsDiv);
            setTimeout(() => { actionsDiv.style.opacity = '1'; }, 50);

            const redoBtn = actionsDiv.querySelector('.redo-btn');
            const downloadBtn = actionsDiv.querySelector('.download-btn');
            const likeBtn = actionsDiv.querySelector('.like-btn');
            const dislikeBtn = actionsDiv.querySelector('.dislike-btn');

            redoBtn.addEventListener('click', () => {
                parentRow.closest('.message-row').remove();
                generateImageResponse(originalText, originalImgSrc);
            });

            downloadBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = `V-GPT_Image_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            likeBtn.addEventListener('click', () => {
                if (likeBtn.classList.contains('filled')) likeBtn.classList.remove('filled');
                else { likeBtn.classList.add('filled'); dislikeBtn.classList.remove('filled'); }
            });

            dislikeBtn.addEventListener('click', () => {
                if (dislikeBtn.classList.contains('filled')) dislikeBtn.classList.remove('filled');
                else { dislikeBtn.classList.add('filled'); likeBtn.classList.remove('filled'); }
            });
        }

        // ======================= 文字生成邏輯 =======================
        function generateChaosString() {
            if(historyText.length === 0) return "無效輸入。";
            const numLines = Math.floor(Math.random() * 30) + 2; 
            let rawResult = "";
            const listMarkers = ["- ", "* ", "1. ", "> "];
            for (let i = 0; i < numLines; i++) {
                let lineStr = (Math.random() < 0.15) ? listMarkers[Math.floor(Math.random() * listMarkers.length)] : "";
                let lineLength = Math.floor(Math.random() * 25) + 5; 
                while (lineStr.length < lineLength) {
                    let chunkSize = Math.floor(Math.random() * 3) + 1;
                    let startIdx = Math.floor(Math.random() * historyText.length);
                    lineStr += historyText.substring(startIdx, startIdx + chunkSize);
                }
                rawResult += lineStr + (i < numLines - 1 ? "\n" : "");
            }
            return rawResult;
        }

        function triggerSwapAnimation(span1, span2, aiContent) {
            if (span1.textContent === '\n' || span2.textContent === '\n' || span1.dataset.isSwapping || span2.dataset.isSwapping) return;
            span1.dataset.isSwapping = "true"; span2.dataset.isSwapping = "true";
            const x1 = span1.offsetLeft, y1 = span1.offsetTop, x2 = span2.offsetLeft, y2 = span2.offsetTop;
            const c1 = document.createElement('span'), c2 = document.createElement('span');
            c1.textContent = span1.textContent; c1.className = 'swap-clone'; c1.style.left = x1+'px'; c1.style.top = y1+'px';
            c2.textContent = span2.textContent; c2.className = 'swap-clone'; c2.style.left = x2+'px'; c2.style.top = y2+'px';
            aiContent.appendChild(c1); aiContent.appendChild(c2);
            span1.style.opacity = '0'; span2.style.opacity = '0';
            void c1.offsetWidth;
            c1.style.left = x2+'px'; c1.style.top = y2+'px';
            c2.style.left = x1+'px'; c2.style.top = y1+'px';
            setTimeout(() => {
                let t = span1.textContent; span1.textContent = span2.textContent; span2.textContent = t;
                span1.style.opacity = '1'; span2.style.opacity = '1';
                c1.remove(); c2.remove();
                delete span1.dataset.isSwapping; delete span2.dataset.isSwapping;
            }, 1200);
        }

        function generateAiResponse() {
            const aiRow = document.createElement('div'); aiRow.className = 'message-row ai-row';
            const aiContent = document.createElement('div'); aiContent.className = 'ai-msg-content';
            aiRow.appendChild(aiContent); chatFeed.appendChild(aiRow);
            const chaosString = generateChaosString();
            let currentSpans = [], i = 0;
            function typeChar() {
                if (i < chaosString.length) {
                    const span = document.createElement('span');
                    span.textContent = chaosString[i]; aiContent.appendChild(span); currentSpans.push(span);
                    if (currentSpans.length > 15 && Math.random() < 0.1) {
                        let idx1 = Math.floor(Math.random() * currentSpans.length);
                        let idx2 = (idx1 + 1) % currentSpans.length;
                        if(!currentSpans[idx1].dataset.isSwapping && !currentSpans[idx2].dataset.isSwapping) triggerSwapAnimation(currentSpans[idx1], currentSpans[idx2], aiContent);
                    }
                    i++;
                    if (centerStage.scrollHeight - centerStage.scrollTop <= centerStage.clientHeight + 100) scrollToBottom();
                    setTimeout(typeChar, 30);
                } else {
                    addTextActions(aiRow, currentSpans);
                }
            }
            typeChar();
        }

        // ======================= 圖像生成動畫邏輯 =======================
        function generateImageResponse(text, imgSrc) {
            const aiRow = document.createElement('div'); aiRow.className = 'message-row ai-row';
            const aiContent = document.createElement('div'); aiContent.className = 'ai-msg-content';
            aiRow.appendChild(aiContent); chatFeed.appendChild(aiRow);

            const ratios = [ [16, 9], [5, 4], [7, 5], [4, 3], [5, 3], [3, 2] ];
            let selectedRatio = ratios[Math.floor(Math.random() * ratios.length)];
            if (Math.random() > 0.5) selectedRatio = [selectedRatio[1], selectedRatio[0]];
            
            const baseSize = 800; 
            let cWidth, cHeight;
            if (selectedRatio[0] > selectedRatio[1]) {
                cWidth = baseSize;
                cHeight = Math.round(baseSize * (selectedRatio[1] / selectedRatio[0]));
            } else {
                cHeight = baseSize;
                cWidth = Math.round(baseSize * (selectedRatio[0] / selectedRatio[1]));
            }

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'image-wrapper';

            const canvas = document.createElement('canvas');
            canvas.width = cWidth;
            canvas.height = cHeight; 
            canvas.style.width = '100%';
            canvas.style.maxWidth = '400px'; 
            canvas.style.height = 'auto'; 
            canvas.style.borderRadius = '12px';
            canvas.style.display = 'block';
            canvas.style.backgroundColor = '#2f2f2f';
            canvas.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
            
            const progressContainer = document.createElement('div');
            progressContainer.style.width = '100%';
            progressContainer.style.maxWidth = '400px';
            progressContainer.style.height = '4px';
            progressContainer.style.backgroundColor = '#444';
            progressContainer.style.borderRadius = '2px';
            progressContainer.style.overflow = 'hidden';

            const progressBar = document.createElement('div');
            progressBar.style.height = '100%';
            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = '#8ab4f8';
            progressBar.style.transition = 'width 0.1s linear';
            progressBar.style.boxShadow = '0 0 8px rgba(138, 180, 248, 0.8)';
            
            progressContainer.appendChild(progressBar);
            imgWrapper.appendChild(canvas);
            imgWrapper.appendChild(progressContainer);
            aiContent.appendChild(imgWrapper);

            const ctx = canvas.getContext('2d');
            let frame = 0;

            const totalFrames = Math.floor(Math.random() * 901) + 600; 
            const visualStopFrame = Math.floor(totalFrames * (Math.random() * 0.7 + 0.3));

            const algoParams = {
                blockSize: Math.floor(Math.random() * 80) + 30,          
                hueOffset: Math.random() * 360,                          
                rotSpeed: (Math.random() - 0.5) * 0.15,                  
                scaleFactor: 1.005 + (Math.random() * 0.04),            
                maxBlur: Math.random() * 5 + 1,                          
                overlayOpacity: Math.random() * 0.15 + 0.05              
            };

            const originXMult = Math.random() > 0.5 ? 1 : 0;
            const originYMult = Math.random() > 0.5 ? 1 : 0;

            const tempC = document.createElement('canvas');
            tempC.width = canvas.width; 
            tempC.height = canvas.height;
            const tc = tempC.getContext('2d');

            let img = null;
            if (imgSrc) {
                img = new Image();
                img.onload = () => startAnim();
                img.src = imgSrc;
            } else {
                startAnim();
            }

            function startAnim() {
                ctx.fillStyle = '#2f2f2f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const baseCanvas = document.createElement('canvas');
                baseCanvas.width = canvas.width; baseCanvas.height = canvas.height;
                const bctx = baseCanvas.getContext('2d');

                if (img) {
                    const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    bctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                }
                
                if (text) {
                    bctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    bctx.font = 'bold 32px monospace'; 
                    bctx.textAlign = 'center';
                    bctx.textBaseline = 'middle';
                    const chars = text.split('');
                    if(chars.length > 0) {
                        for(let i = 0; i < (canvas.width * canvas.height) / 1000; i++) {
                            bctx.fillText(chars[Math.floor(Math.random() * chars.length)], Math.random() * canvas.width, Math.random() * canvas.height);
                        }
                    }
                }

                ctx.drawImage(baseCanvas, 0, 0);

                function animate() {
                    const progressPercent = Math.min(100, (frame / totalFrames) * 100);
                    progressBar.style.width = `${progressPercent}%`;

                    if (frame > totalFrames) {
                        progressContainer.remove(); 
                        addImageActions(imgWrapper, canvas, text, imgSrc); 
                        return;
                    }

                    if (frame <= visualStopFrame) {
                        if (frame < totalFrames * 0.35 && frame % 4 === 0) {
                            const s = algoParams.blockSize; 
                            const sx = Math.floor(Math.random() * (canvas.width/s)) * s;
                            const sy = Math.floor(Math.random() * (canvas.height/s)) * s;
                            const dx = Math.floor(Math.random() * (canvas.width/s)) * s;
                            const dy = Math.floor(Math.random() * (canvas.height/s)) * s;
                            const t1 = ctx.getImageData(sx, sy, s*3, s*3); 
                            const t2 = ctx.getImageData(dx, dy, s*3, s*3);
                            ctx.putImageData(t2, sx, sy);
                            ctx.putImageData(t1, dx, dy);
                        }

                        if (frame > totalFrames * 0.15 && frame < totalFrames * 0.65) {
                            ctx.save();
                            ctx.globalCompositeOperation = 'overlay';
                            ctx.fillStyle = `hsla(${algoParams.hueOffset + Math.random()*100}, 100%, 60%, ${algoParams.overlayOpacity})`;
                            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 150, 150);
                            ctx.restore();
                        }

                        if (frame > totalFrames * 0.35) {
                            tc.clearRect(0, 0, tempC.width, tempC.height);
                            tc.imageSmoothingEnabled = false;
                            tc.drawImage(canvas, 0, 0, canvas.width * 0.8, canvas.height * 0.8);

                            ctx.save();
                            ctx.globalAlpha = Math.random() * 0.2 + 0.15; 
                            
                            const originX = canvas.width * originXMult;
                            const originY = canvas.height * originYMult;
                            ctx.translate(originX, originY);
                            ctx.rotate(algoParams.rotSpeed); 
                            ctx.scale(algoParams.scaleFactor, algoParams.scaleFactor); 
                            ctx.translate(-originX, -originY);
                            
                            ctx.filter = `blur(${Math.random() * algoParams.maxBlur}px)`; 
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(tempC, 0, 0, tempC.width, tempC.height, 0, 0, canvas.width, canvas.height);
                            ctx.restore();
                        }
                    }

                    if (frame > visualStopFrame) {
                        frame += 12; 
                    } else {
                        frame++;
                    }

                    if(frame % 30 === 0 || frame > visualStopFrame) scrollToBottom();
                    requestAnimationFrame(animate);
                }
                animate();
            }
        }

        // ======================= 總體傳送邏輯 =======================
        function processUserInput(text) {
            if (text.trim() === '' && !uploadedImageSrc && !isImageMode) return; 

            historyText += text.replace(/\s+/g, ''); 
            greetingContainer.style.display = 'none';
            chatFeed.style.display = 'flex';
            document.getElementById('top-sponsor').style.display = 'none';
            
            const userRow = document.createElement('div');
            userRow.className = 'message-row user-row';
            let innerHTML = `<div class="user-msg">`;
            if (uploadedImageSrc) innerHTML += `<img src="${uploadedImageSrc}">`;
            if (text.trim() !== '') innerHTML += `<span>${text}</span>`;
            if (isImageMode && text.trim() === '' && !uploadedImageSrc) innerHTML += `<span>[ 進行無提示詞圖像生成 ]</span>`; 
            innerHTML += `</div>`;
            userRow.innerHTML = innerHTML;
            chatFeed.appendChild(userRow);

            scrollToBottom();
            
            if (isImageMode || uploadedImageSrc) {
                generateImageResponse(text, uploadedImageSrc);
            } else {
                generateAiResponse();
            }

            removeImage();
            isImageMode = false;
            modeBadge.style.display = 'none';
            inputField.placeholder = '想問就問';
            inputField.value = '';
        }

        function scrollToBottom() { centerStage.scrollTo({ top: centerStage.scrollHeight, behavior: 'smooth' }); }

        centerStage.addEventListener('scroll', () => {
            const isAtBottom = centerStage.scrollHeight - centerStage.scrollTop <= centerStage.clientHeight + 15; 
            scrollBtn.style.display = isAtBottom ? 'none' : 'flex';
        });

        scrollBtn.addEventListener('click', scrollToBottom);
        sendBtn.addEventListener('click', () => { 
            const t = inputField.value.trim();
            if (t !== '' || uploadedImageSrc || isImageMode) processUserInput(t); 
        });
        inputField.addEventListener('keypress', (e) => { 
            const t = inputField.value.trim();
            if (e.key === 'Enter' && (t !== '' || uploadedImageSrc || isImageMode)) processUserInput(t); 
        });
    </script>
