<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吳沅冠靈光雕塑系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
    canvas { display: block; }

    #ui-wrapper-left {
      position: absolute; bottom: 30px; left: 30px; z-index: 100; font-family: 'VT323', monospace;
    }

    #hdr-tag {
      position: absolute; top: -22px; left: 0; color: #ffffff; font-size: 14px;
      letter-spacing: 1px; opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none; display: none;
    }
    #hdr-tag.visible { display: block; opacity: 0.9; }

    #control-panel {
      display: flex; align-items: center; background: rgba(0, 0, 0, 0); 
      border: 1px solid #ffffff; width: 360px; height: 34px; overflow: hidden; 
      transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }
    #control-panel.is-collapsed { width: 0; opacity: 0; transform: scaleX(0); border-color: transparent; pointer-events: none; }

    #coord-input {
      background: transparent; color: #ffffff; border: none;
      padding: 0 10px 4px 10px; font-family: 'VT323', monospace;
      font-size: 18px; flex-grow: 1; height: 100%; outline: none; letter-spacing: 1px;
    }

    .ui-btn {
      background: transparent; border: none; border-left: 1px solid rgba(255,255,255,0.4);
      height: 100%; width: 40px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; color: white; transition: all 0.2s ease; flex-shrink: 0;
    }
    .ui-btn:hover { background: rgba(255, 255, 255, 0.15); }

    #collapse-btn { font-family: 'VT323', monospace; font-size: 20px; width: 36px; }

    #collapsed-trigger {
      position: absolute; bottom: 0; left: 0; color: #ffffff; font-size: 24px;
      cursor: pointer; opacity: 0; transition: opacity 0.4s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #collapsed-trigger.active { opacity: 1; pointer-events: auto; }

    .blink { animation: blink-animation 1s steps(2, start) infinite; }
    @keyframes blink-animation { to { visibility: hidden; } }
    .pixel-icon { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 1; }
  </style>
</head>
<body>

<div id="ui-wrapper-left">
  <div id="hdr-tag">[HDR]</div>
  <div id="control-panel">
    <input type="text" id="coord-input" spellcheck="false" autocomplete="off">
    <button id="copy-btn" class="ui-btn" title="COPY">
      <svg class="pixel-icon" viewBox="0 0 10 10">
        <rect x="0.5" y="2.5" width="6" height="6" />
        <rect x="3.5" y="0.5" width="6" height="6" />
      </svg>
    </button>
    <button id="fs-btn" class="ui-btn" title="FULLSCREEN">
      <svg class="pixel-icon" viewBox="0 0 16 16" fill="white" stroke="none">
        <path id="fs-path" d="M1 1h5v1H2v4h-1V1zm9 0h5v5h-1V2h-4V1zM1 10h1v4h4v1H1v-5zm14 0v5h-5v-1h4v-4h1z" />
      </svg>
    </button>
    <button id="collapse-btn" class="ui-btn" title="COLLAPSE">&lt;</button>
  </div>
  <div id="collapsed-trigger">&gt;<span class="blink">_</span></div>
</div>

<script>
let myShader, time = 0, colorTime = 0, forcePoints = [], clickCount = 0;
let isUiFocused = false, currentStatus = "expanded", isHDRSupported = false;
let params = { ringCount: 6, cameraZ: 8.5, speed: 0.04, baseBright: 0.35, glowBoost: 40, sat: 1.2, distort: 0.5 };

const vert = `#version 300 es
precision highp float;
in vec3 aPosition;
void main() { gl_Position = vec4(aPosition.xy * 2.0 - 1.0, 0.0, 1.0); }`;

const frag = `#version 300 es
precision highp float;
uniform vec2 r, uRot;
uniform float t, ct, uBaseBright, uGlowBoost, uCameraZ, uSat, uDistort, uRingCount;
uniform bool uIsHDR; 
uniform vec3 uForcePos[7];
uniform float uForceStrength[7], uForceRadius[7];
out vec4 o;

float cheapNoise(vec3 p) {
    float n = sin(p.x * 2.2 + p.y * 1.5 + p.z * 1.2) + sin(p.x * 1.5 - p.y * 2.1 + p.z * 1.8);
    return n * 0.4;
}
float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}
mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
vec3 rotate3D(vec3 p, vec3 r_ang) {
    p.yz *= rot(r_ang.x); p.xz *= rot(r_ang.y); p.xy *= rot(r_ang.z);
    return p;
}
vec3 ACESFilm(vec3 x) { return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - r.xy) / min(r.x, r.y);
    o = vec4(0.0);
    float z = 0.0;
    // 🌟 Shader 演算法擴張：迴圈上限提升至 30，支持手動輸入的高負載模式
    for(int i = 0; i < 40; i++) {
        vec3 p_orig = z * normalize(vec3(uv, 1.8));
        p_orig.z -= uCameraZ; 
        p_orig = rotate3D(p_orig, vec3(uRot.x, uRot.y, 0.0));
        float mD = 1e5;
        for(int j = 1; j <= 30; j++) { 
            float fj = float(j);
            if(fj > uRingCount) break; 
            vec3 p = p_orig;
            p = rotate3D(p, vec3(uRot.x, uRot.y, 0.0) * (0.3 + fj * 0.1) + fj * 2.5);
            float theta = atan(p.y, p.x);
            float disto = cheapNoise(vec3(p.x * 0.5, p.y * 0.5, t * 0.5 + fj)) * uDistort;
            float dynamicR = (2.2 + fj * 0.6) + disto + sin(theta * (2.0 + fj * 0.2) + t) * 0.2;
            vec2 crossSection = vec2(length(p.xy) - dynamicR, p.z);
            float d_ring = length(crossSection - vec2(sin(theta*2.0 + t), cos(theta*1.6 - t))*2.5) - 0.12;
            mD = smin(mD, d_ring, 0.85);
        }
        float rOffset = 0.0;
        for(int k = 0; k < 7; k++) {
            float dF = length(p_orig - uForcePos[k] * 1.8);
            if(dF < uForceRadius[k] * 1.5) {
                float pct = 1.0 - (dF / (uForceRadius[k] * 1.5));
                rOffset += uForceStrength[k] * 4.0 * pct * pct;
            }
        }
        float d = 0.2 * abs(mD) + 0.02;
        z += d * 0.35; 
        float theta_main = atan(p_orig.y, p_orig.x);
        vec3 proceduralCol = cos(theta_main * 1.2 + ct + p_orig.y * 0.3 + vec3(0.0, 1.2, 2.5)) + uSat; 
        float plasmaAccum = (z * 0.12 / (d + 0.005)) + uBaseBright; 
        vec3 AccColor = (proceduralCol * plasmaAccum * 12.0) + (proceduralCol * rOffset * 0.15 * uGlowBoost);
        o += vec4(AccColor, 1.0); 
    }
    if (uIsHDR) { o.rgb = o.rgb / 7000.0; } 
    else { o.rgb = ACESFilm(o.rgb / 2.8e4); }
    o.a = 1.0;
}`;

function setup() {
  isHDRSupported = window.matchMedia('(dynamic-range: high)').matches;
  const canvas = createCanvas(windowWidth, windowHeight, WEBGL);
  if (isHDRSupported) canvas.elt.getContext('webgl2', { colorSpace: 'display-p3', pixelFormat: 'float16' });
  pixelDensity(min(window.devicePixelRatio, 1.5));
  myShader = createShader(vert, frag);
  for (let i = 0; i < 7; i++) {
    forcePoints.push({ pos: createVector(0,0,0), angle: random(TAU), isPermanent: i < 3, strength: 0, radius: random(200, 350), angleVel: random(0.01, 0.04) });
  }

  const panel = document.getElementById('control-panel'), trigger = document.getElementById('collapsed-trigger');
  const collapseBtn = document.getElementById('collapse-btn'), hdrTag = document.getElementById('hdr-tag');
  const inputEl = document.getElementById('coord-input'), fsBtn = document.getElementById('fs-btn');

  if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
    fsBtn.style.display = 'none'; panel.style.width = '320px';
  }

  function updateHdrTag() {
    if (isHDRSupported && currentStatus === "expanded") hdrTag.classList.add('visible');
    else hdrTag.classList.remove('visible');
  }

  collapseBtn.addEventListener('click', (e) => {
    e.stopPropagation(); currentStatus = "collapsed";
    panel.classList.add('is-collapsed'); updateHdrTag();
    setTimeout(() => { trigger.classList.add('active'); }, 200);
  });

  trigger.addEventListener('click', (e) => {
    e.stopPropagation(); currentStatus = "expanded";
    trigger.classList.remove('active'); panel.classList.remove('is-collapsed');
    setTimeout(updateHdrTag, 100);
  });

  fsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  document.addEventListener('fullscreenchange', () => {
    const fsPath = document.getElementById('fs-path');
    if (document.fullscreenElement) fsPath.setAttribute('d', 'M5 5h-4v1h3v3h1V5zm6 0v4h1v-3h3v-1h-4zM5 11v-4h-1v3h-3v1h4zm6 0h4v-1h-3v-3h-1v4z');
    else fsPath.setAttribute('d', 'M1 1h5v1H2v4h-1V1zm9 0h5v5h-1V2h-4V1zM1 10h1v4h4v1H1v-5zm14 0v5h-5v-1h4v-4h1z');
  });

  inputEl.addEventListener('focus', () => isUiFocused = true);
  inputEl.addEventListener('blur', () => isUiFocused = false);
  inputEl.addEventListener('input', (e) => loadFromID(e.target.value));

  document.getElementById('copy-btn').addEventListener('click', (e) => {
    e.stopPropagation(); inputEl.select();
    navigator.clipboard.writeText(inputEl.value);
    panel.style.borderColor = "#00ffcc"; setTimeout(() => panel.style.borderColor = "#ffffff", 200);
  });

  updateHdrTag(); syncUi();
}

function getCoordinateID() {
  return `${params.ringCount}_${params.cameraZ.toFixed(1)}_${params.speed.toFixed(3)}_${params.baseBright.toFixed(2)}_${params.glowBoost.toFixed(0)}_${params.sat.toFixed(1)}_${params.distort.toFixed(1)}`;
}

function loadFromID(id) {
  let parts = id.split('_');
  if (parts.length === 7) {
    // 🌟 核心修改：手動輸入模式，完全解除 ringCount 的上限限制
    params.ringCount = parseFloat(parts[0]) || 1; 
    params.cameraZ = parseFloat(parts[1]) || 5;
    params.speed = parseFloat(parts[2]) || 0.01;
    params.baseBright = parseFloat(parts[3]) || 0.1;
    params.glowBoost = parseFloat(parts[4]) || 0;
    params.sat = parseFloat(parts[5]) || 1;
    params.distort = parseFloat(parts[6]) || 0;
  }
}

function syncUi() { document.getElementById('coord-input').value = getCoordinateID(); }

function mousePressed() {
  if (isUiFocused) return;
  if (currentStatus === "expanded" && (mouseY > height - 80 && mouseX < 420)) return;
  if (currentStatus === "collapsed" && (mouseY > height - 80 && mouseX < 100)) return;

  if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
    clickCount++;
    if (clickCount % 5 === 0) {
      // 🌟 核心修改：隨機邏輯依然維持 1~6 的安全比例
      params.ringCount = params.ringCount < 4 ? floor(random(4, 7)) : floor(random(1, 4)); 
      params.cameraZ = params.cameraZ < 10.0 ? random(20.0, 30.0) : random(3.0, 5.0); 
      params.speed = params.speed < 0.05 ? random(0.12, 0.2) : random(0.002, 0.008); 
      params.baseBright = params.baseBright > 0.4 ? random(0.01, 0.1) : random(0.7, 1.2); 
      params.glowBoost = params.glowBoost < 40 ? random(100, 150) : random(0, 15); 
      params.sat = params.sat > 1.2 ? random(0.2, 0.6) : random(2.0, 3.0); 
      params.distort = params.distort > 0.8 ? 0.0 : random(1.5, 2.5); 
    } else {
      params.ringCount = floor(random(1, 7)); 
      params.cameraZ = random(4.5, 18.0);      
      params.speed = random(0.01, 0.1); params.baseBright = random(0.1, 0.7);   
      params.glowBoost = random(10, 80); params.sat = random(0.6, 2.0);           
      params.distort = random(0.1, 1.5);       
    }
    syncUi();
  }
}

function draw() {
  background(0);
  time += params.speed; colorTime += params.speed * 1.5;
  forcePoints.forEach(fp => {
    fp.angle += fp.angleVel;
    fp.pos.x = 220 * cos(fp.angle); fp.pos.y = 220 * sin(fp.angle);
    fp.strength = fp.isPermanent ? 140 : 80;
  });
  shader(myShader);
  myShader.setUniform('uIsHDR', isHDRSupported); 
  myShader.setUniform('r', [width * pixelDensity(), height * pixelDensity()]);
  myShader.setUniform('t', time); myShader.setUniform('ct', colorTime);
  myShader.setUniform('uRot', [frameCount * 0.005, frameCount * 0.003]);
  myShader.setUniform('uBaseBright', params.baseBright); myShader.setUniform('uGlowBoost', params.glowBoost);
  myShader.setUniform('uCameraZ', params.cameraZ); myShader.setUniform('uSat', params.sat);
  myShader.setUniform('uDistort', params.distort); myShader.setUniform('uRingCount', params.ringCount);
  let fPos = [], fStr = [], fRad = [];
  forcePoints.forEach(fp => {
    fPos.push(fp.pos.x * 0.02, fp.pos.y * 0.02, fp.pos.z * 0.02);
    fStr.push(fp.strength * 0.0016); fRad.push(fp.radius * 0.012);
  });
  myShader.setUniform('uForcePos', fPos); myShader.setUniform('uForceStrength', fStr);
  myShader.setUniform('uForceRadius', fRad);
  rect(-width / 2, -height / 2, width, height);
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
